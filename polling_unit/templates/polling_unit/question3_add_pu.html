{% extends 'polling/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card shadow mb-5">
            <div class="card-header bg-warning text-dark">
                <h4>Level 3: Enter New Polling Unit & Results</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <h5 class="text-primary">1. Polling Unit Details</h5>
                    <div class="mb-3">
                        <label class="form-label">Polling Unit Name:</label>
                        <input type="text" name="pu_name" class="form-control" placeholder="e.g., Central Primary School" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Polling Unit Number:</label>
                        <input type="text" name="pu_number" class="form-control" placeholder="e.g., DT1901099" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select LGA:</label>
                        <select name="lga_id" class="form-select" required>
                            <option value="">-- Select LGA --</option>
                            {% for lga in lgas %}
                                <option value="{{ lga.lga_id }}">{{ lga.lga_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <h5 class="text-primary mt-4">2. Enter Party Scores</h5>
                    <div class="row">
                        {% for party in parties %}
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><strong>{{ party.partyname }}</strong> Score:</label>
                                <input type="number" name="party_{{ party.partyid }}" class="form-control" value="0" min="0" required>
                            </div>
                        {% endfor %}
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">Save Polling Unit & Results</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
